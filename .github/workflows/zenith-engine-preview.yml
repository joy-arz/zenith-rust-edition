name: Zenith engine preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version in the form X.Y.Z-preview.N
        required: true
        default: 0.2.0-preview.1
      source_commit:
        description: Exact commit SHA for an artifact-only rebuild or a draft promotion
        type: string
        default: ''
      publish_preview:
        description: Sign and publish verified archives from the public engine repository
        type: boolean
        default: false
      draft_checksums_sha256:
        description: SHA-256 of SHA256SUMS in an existing draft release, to promote without a rebuild
        type: string
        default: ''

permissions:
  contents: read

env:
  HORIZON_VERSION: ${{ inputs.version }}
  ZENITH_RUST_EDITION: "1"
  HORIZON_TELEMETRY_URL: 'off'
  CARGO_INCREMENTAL: '0'
  ZENITH_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}

jobs:
  build:
    if: >-
      !inputs.draft_checksums_sha256
      && (github.repository == 'joy-arz/zenith-rust-edition' || github.repository == 'joy-arz/Zenith')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x64
            exe: .exe
          - os: windows-11-vs2026-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            exe: .exe
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    env:
      BUILD_TARGET: ${{ matrix.target }}
      OUTPUT: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}fast
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.ZENITH_SOURCE_COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure the Windows ARM64 LLVM assembler
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $llvmBin 'clang.exe'))) {
            "$llvmBin" >> $env:GITHUB_PATH
          }
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Validate version and build the game
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENITH_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$ZENITH_SOURCE_COMMIT" ]]
          [[ "$HORIZON_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.[1-9][0-9]*$ ]]
          python3 tools/check_public_tree.py
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --profile fast --locked ${BUILD_TARGET:+--target "$BUILD_TARGET"} -p horizon-official -p horizon-client-lib \
            -p horizon-prepare -p horizon-server \
            --bin horizon-official --bin horizon-ctl --bin horizon-prepare --bin horizon-server
      - name: Package and check the client
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          folder="zenith-$PLATFORM"
          cp -f "$OUTPUT/horizon-official$EXE" "$OUTPUT/horizon-client$EXE"
          cargo run --locked -p xtask -- package-source "$OUTPUT/horizon-client$EXE" "dist/$folder"
          [[ "$("dist/$folder/horizon-client$EXE" --help)" == *--resources* ]]
          [[ "$("dist/$folder/horizon-client$EXE" --version)" == "Zenith Rust Edition $HORIZON_VERSION" ]]
          [[ "$("dist/$folder/horizon-prepare$EXE" --version)" == *"$HORIZON_VERSION"* ]]
          (cd dist && tar -czf "$folder.tar.gz" "$folder")
      - name: Package and check the Linux server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile fast --locked -p horizon-client --no-default-features --bin horizon-client
          folder=zenith-server-linux-x86_64
          cargo run --locked -p xtask -- package-server-source "$OUTPUT/horizon-client" "dist/$folder"
          [[ "$("dist/$folder/horizon-server" --version)" == "horizon-server $HORIZON_VERSION" ]]
          (cd dist && tar -czf "$folder.tar.gz" "$folder")
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.ZENITH_SOURCE_COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: zenith-*
          path: dist
          merge-multiple: true
      - name: Record the exact source and verify preview signatures
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENITH_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$ZENITH_SOURCE_COMMIT" ]]
          tag="zenith-game@$HORIZON_VERSION"
          git archive --format=tar.gz --output=dist/zenith-source.tar.gz HEAD
          upstream=$(cat packaging/zenith-engine-upstream.txt)
          mixins=$(sed -nE 's/^pub const MIXINS_REV: &str = "([0-9a-f]{40})";$/\1/p' launcher/src/native_mods.rs)
          protocol=$(sed -nE 's/^pub const PROTOCOL_VERSION: i32 = ([0-9]+);$/\1/p' crates/horizon-core/src/version.rs)
          vanilla=$(sed -nE 's/^pub const VANILLA_VERSION: &str = "([^"]+)";$/\1/p' crates/horizon-core/src/version.rs)
          [[ "$upstream" =~ ^[0-9a-f]{40}$ && "$mixins" =~ ^[0-9a-f]{40}$ && -n "$protocol" && -n "$vanilla" ]]
          jq -n --arg commit "$ZENITH_SOURCE_COMMIT" --arg tag "$tag" --arg version "$HORIZON_VERSION" \
            --arg upstream "$upstream" --arg mixins "$mixins" --arg minecraft "$vanilla" --argjson protocol "$protocol" \
            '{source_commit:$commit,tag:$tag,version:$version,channel:"preview",upstream_commit:$upstream,
              mixins_commit:$mixins,minecraft_compatibility:$minecraft,protocol:$protocol}' > dist/preview.json
          EPHEMERAL=yes bash tools/ci/sign_release.sh "$tag" dist/*.tar.gz dist/preview.json
          cargo run --locked --quiet -p horizon-release-sign -- verify \
            --tag "$tag" --key "$(cat dist/ephemeral.pub)" dist
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-preview-verification
          path: |
            dist/preview.json
            dist/zenith-source.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/ephemeral.pub
          if-no-files-found: error

  publish:
    environment: zenith-engine-release
    if: >-
      !cancelled() && inputs.publish_preview && github.repository == 'joy-arz/zenith-rust-edition'
      && !github.event.repository.private && github.ref == 'refs/heads/main'
      && ((needs.verify.result == 'success' && !inputs.source_commit)
          || (needs.verify.result == 'skipped' && inputs.source_commit && inputs.draft_checksums_sha256))
    needs: verify
    concurrency: zenith-publish-${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        if: '!inputs.draft_checksums_sha256'
        with:
          pattern: zenith-*
          path: dist
          merge-multiple: true
      - name: Download the staged preview
        if: inputs.draft_checksums_sha256
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_SUMS_SHA256: ${{ inputs.draft_checksums_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HORIZON_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.[1-9][0-9]*$ ]]
          [[ "$ZENITH_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$DRAFT_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          tag="zenith-game@$HORIZON_VERSION"
          git merge-base --is-ancestor "$ZENITH_SOURCE_COMMIT" HEAD
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish |
            jq -e --arg commit "$ZENITH_SOURCE_COMMIT" '.isDraft and .targetCommitish == $commit'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'zenith-*.tar.gz' --pattern preview.json --pattern SHA256SUMS \
            --pattern SHA256SUMS.sig --pattern ephemeral.pub
          printf '%s  %s\n' "$DRAFT_SUMS_SHA256" dist/SHA256SUMS | sha256sum --strict --check
      - name: Verify the preview before using the release key
        shell: bash
        run: |
          set -euo pipefail
          tag="zenith-game@$HORIZON_VERSION"
          jq -e --arg tag "$tag" --arg commit "$ZENITH_SOURCE_COMMIT" --arg version "$HORIZON_VERSION" \
            '.tag == $tag and .source_commit == $commit and .version == $version and .channel == "preview"' dist/preview.json
          # Require the same payload set in both paths, independent of the uploaded filenames.
          diff -u <(printf '%s\n' preview.json zenith-{linux-x86_64,macos-arm64,macos-x64,server-linux-x86_64,source,windows-arm64,windows-x64}.tar.gz | sort) \
            <(sed -nE 's/^[0-9a-f]{64}  ([a-z0-9._-]+)$/\1/p' dist/SHA256SUMS | sort)
          [[ "$(wc -l < dist/SHA256SUMS)" -eq 8 ]]
          (cd dist && sha256sum --strict --check SHA256SUMS)
          cargo run --locked --quiet -p horizon-release-sign -- verify \
            --tag "$tag" --key "$(cat dist/ephemeral.pub)" dist
      - name: Sign the verified checksums for Zenith Launcher
        env:
          ZENITH_ENGINE_SIGNING_KEY: ${{ secrets.ZENITH_ENGINE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/sign_zenith_checksums.sh "zenith-game@$HORIZON_VERSION" dist launcher/zenith-engine-release-keys.txt
      - name: Publish the signed preview
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_SUMS_SHA256: ${{ inputs.draft_checksums_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tag="zenith-game@$HORIZON_VERSION"
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$tag" \
            --signature SHA256SUMS.zenith.sig --key "$(cat launcher/zenith-engine-release-keys.txt)" dist
          api="repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          ref=$(gh api "$api" --jq '.[] | select(.ref == "refs/tags/'"$tag"'") | .object.sha')
          if [[ -z "$ref" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$ZENITH_SOURCE_COMMIT" --silent
          else
            [[ "$ref" == "$ZENITH_SOURCE_COMMIT" ]]
          fi
          if [[ -n "$DRAFT_SUMS_SHA256" ]]; then
            gh release upload "$tag" dist/SHA256SUMS.zenith.sig --repo "$GITHUB_REPOSITORY" --clobber
            release_id=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
            diff -u <((cd dist && sha256sum -- *) | awk '{print $2, "sha256:" $1}' | sort) \
              <(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.assets[] | [.name, .digest] | join(" ")' | sort)
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --prerelease --latest=false --title "Zenith Rust Edition $HORIZON_VERSION" \
              --notes-file packaging/ZENITH-PREVIEW.txt dist/*.tar.gz dist/preview.json \
              dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.zenith.sig dist/ephemeral.pub
          fi
